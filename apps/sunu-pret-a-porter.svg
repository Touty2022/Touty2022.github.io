<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Logo Sunu Prêt-à-porter : un cintre, une robe et le fil d'une aiguille -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#831843"/><stop offset="0.5" stop-color="#db2777"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="tissu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4a0d26" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="120" cy="90" r="190" fill="#ffffff" opacity="0.08"/>
  <g filter="url(#ombre)">
    <!-- Crochet et barre du cintre -->
    <path d="M256 150 C256 132 270 120 286 124 C302 128 306 150 290 160 L256 178" stroke="#ffffff" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 178 L118 246 C108 251 112 262 122 262 L390 262 C400 262 404 251 394 246 Z" fill="none" stroke="#ffffff" stroke-width="11" stroke-linejoin="round"/>
    <!-- Robe (boubou) -->
    <path d="M196 262 L226 262 C232 280 280 280 286 262 L316 262 L352 300 L326 322 L312 308 L340 420 L172 420 L200 308 L186 322 L160 300 Z" fill="url(#tissu)"/>
    <!-- Broderie dorée -->
    <path d="M226 262 C232 280 280 280 286 262" stroke="url(#or)" stroke-width="7" fill="none"/>
    <path d="M256 284 L256 352" stroke="url(#or)" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12"/>
    <path d="M186 396 L326 396" stroke="url(#or)" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- Aiguille et fil -->
  <path d="M380 112 L432 64" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="426" cy="70" rx="5" ry="10" transform="rotate(45 426 70)" fill="none" stroke="#831843" stroke-width="3"/>
  <path d="M426 70 C460 120 420 170 380 150 C350 136 360 100 392 104" stroke="url(#or)" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
