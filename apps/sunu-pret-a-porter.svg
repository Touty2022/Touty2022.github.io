<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo Solvio (copie de l'icône de l'application) : une robe en wax sur un cintre, le fil d'or d'une aiguille -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c096c"/>
      <stop offset="0.55" stop-color="#7b2cbf"/>
      <stop offset="1" stop-color="#d6336c"/>
    </linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe8a3"/>
      <stop offset="0.5" stop-color="#f4b400"/>
      <stop offset="1" stop-color="#c77d00"/>
    </linearGradient>
    <!-- Motif wax : cercles concentriques et feuilles, comme sur les pagnes -->
    <pattern id="wax" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <rect width="56" height="56" fill="#ff6b35"/>
      <circle cx="14" cy="14" r="11" fill="#ffd166"/>
      <circle cx="14" cy="14" r="6" fill="#1b998b"/>
      <circle cx="14" cy="14" r="2.5" fill="#fff8ee"/>
      <circle cx="42" cy="42" r="11" fill="#ffd166"/>
      <circle cx="42" cy="42" r="6" fill="#1b998b"/>
      <circle cx="42" cy="42" r="2.5" fill="#fff8ee"/>
      <path d="M42 6c8 4 8 12 0 16-8-4-8-12 0-16z" fill="#7b2cbf"/>
      <path d="M14 34c8 4 8 12 0 16-8-4-8-12 0-16z" fill="#7b2cbf"/>
    </pattern>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#240046" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#fond)"/>
  <!-- Crochet du cintre -->
  <path d="M256 128v-14c0-10 8-16 18-20a20 20 0 1 0-27-19" fill="none" stroke="url(#or)" stroke-width="11" stroke-linecap="round"/>
  <!-- Robe en wax -->
  <g filter="url(#ombre)">
    <path d="M222 128c10 14 24 20 34 20s24-6 34-20l22 12-12 58c-4 20-6 36-6 52 30 40 58 100 74 168-50 14-96 18-112 18s-62-4-112-18c16-68 44-128 74-168 0-16-2-32-6-52l-12-58z" fill="url(#wax)"/>
    <path d="M222 128c10 14 24 20 34 20s24-6 34-20l22 12-12 58c-4 20-6 36-6 52 30 40 58 100 74 168-50 14-96 18-112 18s-62-4-112-18c16-68 44-128 74-168 0-16-2-32-6-52l-12-58z" fill="none" stroke="#fff8ee" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <!-- Ceinture : le fil d'or de l'aiguille fait le tour de la taille -->
  <path d="M204 252c34 14 70 14 104 0" fill="none" stroke="url(#or)" stroke-width="12" stroke-linecap="round"/>
  <path d="M308 252c26-10 48-34 60-64" fill="none" stroke="url(#or)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/>
  <!-- Aiguille -->
  <g transform="rotate(38 388 150)">
    <path d="M384 92h8l-1 112-3 14-3-14z" fill="url(#or)"/>
    <ellipse cx="388" cy="104" rx="2.4" ry="8" fill="#3c096c"/>
  </g>
  <!-- Petites étoiles d'éclat -->
  <path d="M120 150l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="#ffe8a3"/>
  <path d="M400 380l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#ffe8a3" opacity="0.85"/>
</svg>
