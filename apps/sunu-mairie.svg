<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Logo Sunu Mairie : la mairie (volet administratif) et une pièce (volet taxes) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/><stop offset="0.55" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="mur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1b4d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="120" cy="90" r="190" fill="#ffffff" opacity="0.08"/>
  <g filter="url(#ombre)">
    <!-- Drapeau -->
    <path d="M232 92 L232 150" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <path d="M236 94 L292 94 L280 112 L292 130 L236 130 Z" fill="url(#or)"/>
    <!-- Fronton -->
    <path d="M110 214 L232 150 L354 214 Z" fill="url(#mur)"/>
    <circle cx="232" cy="194" r="13" fill="#2563eb"/>
    <!-- Colonnes -->
    <rect x="124" y="226" width="216" height="14" rx="5" fill="#ffffff"/>
    <rect x="138" y="246" width="26" height="110" rx="8" fill="url(#mur)"/>
    <rect x="186" y="246" width="26" height="110" rx="8" fill="url(#mur)"/>
    <rect x="252" y="246" width="26" height="110" rx="8" fill="url(#mur)"/>
    <rect x="300" y="246" width="26" height="110" rx="8" fill="url(#mur)"/>
    <rect x="112" y="362" width="240" height="18" rx="7" fill="#ffffff"/>
    <rect x="96" y="384" width="272" height="20" rx="8" fill="#dbeafe"/>
    <!-- Pièce FCFA (taxes) -->
    <circle cx="372" cy="356" r="62" fill="url(#or)" stroke="#ffffff" stroke-width="8"/>
    <text x="372" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="50" fill="#92400e">F</text>
  </g>
  <!-- Étoile du drapeau -->
  <path d="M262 104 l4 8 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1 z" fill="#15803d"/>
</svg>
